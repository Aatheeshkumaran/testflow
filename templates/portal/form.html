{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><h1>{{ title }}</h1><a class="btn" href="{% url back %}">Back</a></div>
<form method="post" class="card form-card" novalidate>
  {% csrf_token %}
  {% include "partials/form_fields.html" %}
  <div class="form-actions"><button class="btn primary">Save</button><a class="btn" href="{% url back %}">Cancel</a></div>
</form>
{% endblock %}
