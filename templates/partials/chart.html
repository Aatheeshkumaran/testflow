<div class="card">
  <div class="card-head"><div><h2>{{ title }}</h2>{% if sub %}<div class="muted small">{{ sub }}</div>{% endif %}</div></div>
  <div class="chart-box {{ size }}"><canvas data-chart="{{ cid }}" role="img" aria-label="{{ title }}"></canvas></div>
  {{ config|json_script:cid }}
</div>
