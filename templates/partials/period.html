<form method="get" class="actions">{% if batch %}<input type="hidden" name="batch" value="{{ batch.pk }}">{% endif %}
  <label for="days" class="small muted" style="margin:0">Period</label>
  <select id="days" name="days" style="width:auto" onchange="this.form.submit()">
    <option value="30" {% if days == 30 %}selected{% endif %}>Last 30 days</option>
    <option value="90" {% if days == 90 %}selected{% endif %}>Last 90 days</option>
    <option value="180" {% if days == 180 %}selected{% endif %}>Last 6 months</option>
    <option value="365" {% if days == 365 %}selected{% endif %}>Last 12 months</option>
    <option value="0" {% if days == 0 %}selected{% endif %}>All time</option>
  </select>
</form>
