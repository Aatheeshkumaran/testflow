{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1>
  {% if forced %}<p class="muted">You signed in with a temporary password. Choose your own password to continue.</p>{% endif %}</div></div>
<form method="post" class="card form-card" novalidate>
  {% csrf_token %}
  {% include "partials/form_fields.html" %}
  <div class="form-actions"><button class="btn primary">Save password</button></div>
</form>
{% endblock %}
